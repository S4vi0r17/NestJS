services:
  db:
    image: postgres:15.2
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    container_name: nest-auth-orm-db
    volumes:
      - ./db_data:/var/lib/postgresql/data
